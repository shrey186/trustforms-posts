<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Pop;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:Pop;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:PopI;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-MediumItalic.ttf)}
:root{--navy:#0B233F;--ink:#0A1B2E;--teal:#09BC99;--teal2:#0E9F85;--soft:#53C2A9;--mint:#F0FFFC;--pale:#DDF8F1;--grey:#5B6B7B;--line:#CFF2E9}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;overflow:hidden;font-family:Inter,sans-serif;color:var(--ink);
 background:radial-gradient(circle at 92% 8%,#D6F7EE 0,transparent 32%),radial-gradient(circle at 0% 100%,#DDF8F1 0,transparent 35%),linear-gradient(180deg,#F4FFFC,#E9FBF6);position:relative}
.dark body,body.dark{background:radial-gradient(circle at 90% 10%,#123A5E 0,transparent 35%),linear-gradient(180deg,#0B233F,#071829);color:#fff}
.hdr{position:absolute;left:60px;top:52px;display:flex;align-items:center;gap:20px}
.logo{width:96px;height:96px;border-radius:24px;background:var(--navy);display:flex;align-items:center;justify-content:center;font:700 50px Pop;color:#fff;letter-spacing:-3px}
.logo b{color:var(--teal)}
.word{font:700 58px Pop;letter-spacing:-2px;line-height:1}.word b{color:var(--teal)}
.tag{font:600 19px Inter;letter-spacing:7px;color:#3E5F6E;margin-top:8px}
.pill{position:absolute;right:56px;top:66px;border:2px solid #BFEFE3;background:rgba(255,255,255,.6);border-radius:40px;padding:16px 28px 16px 22px;display:flex;gap:14px;align-items:center;font:500 20px Inter;line-height:1.3;max-width:360px}
.spark{color:var(--teal);font-size:34px}
.eyebrow{font:600 22px Inter;letter-spacing:5px;color:#4B6670;text-transform:uppercase}
h1{font:700 76px Pop;line-height:1.06;letter-spacing:-2.5px;color:var(--ink)}
h1 em{font-style:normal;color:var(--teal);position:relative;white-space:nowrap}
h1 em.u::after{content:"";position:absolute;left:2%;right:2%;bottom:-6px;height:12px;border-bottom:6px solid var(--teal);border-radius:0 0 50% 50%/0 0 100% 100%}
.sub{font:400 28px Inter;line-height:1.45;color:#4A5D6E}
.cta{display:inline-flex;align-items:center;gap:14px;background:linear-gradient(180deg,#12C9A5,#06A986);color:#fff;font:500 30px Pop;padding:22px 40px;border-radius:60px;box-shadow:0 14px 30px rgba(9,188,153,.35)}
.checks{display:flex;gap:26px;font:500 20px Inter;color:#4A5D6E;margin-top:18px}
.checks span::before{content:"✓";display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-size:17px;align-items:center;justify-content:center;margin-right:10px;font-weight:700}
.note{position:absolute;font:28px PopI;color:var(--teal2);line-height:1.15;transform:rotate(-12deg)}
.card{background:rgba(255,255,255,.92);border:1.5px solid #E2F5EF;border-radius:26px;box-shadow:0 10px 30px rgba(11,35,63,.06)}
.feat{display:flex;gap:20px;align-items:center;padding:20px 24px}
.ico{flex:none;width:72px;height:72px;border-radius:20px;background:#E3FAF4;color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:34px}
.feat h4{font:600 25px Inter;color:var(--ink)}.feat p{font:400 19px Inter;color:#5B6B7B;margin-top:4px}
.strip{position:absolute;left:40px;right:40px;bottom:40px;display:flex;justify-content:space-between;padding:22px 26px}
.strip div{display:flex;gap:14px;align-items:center;flex:1;padding:0 8px;border-right:1.5px solid #D9EEE8}.strip div:last-child{border:none}
.strip i{font-style:normal;flex:none;width:58px;height:58px;border-radius:50%;background:#E3FAF4;color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:26px}
.strip b{display:block;font:700 23px Inter}.strip small{font:400 17px Inter;color:#5B6B7B}
/* laptop */
.laptop{position:absolute}
.screen{background:#0E1E2C;border-radius:22px 22px 0 0;padding:14px;box-shadow:0 30px 60px rgba(11,35,63,.25)}
.app{display:flex;background:#F7FAFB;border-radius:8px;overflow:hidden;height:100%}
.side{width:24%;background:#0F2E3B;color:#CFE3E8;padding:16px 12px;font:500 13px Inter}
.side .b{font:700 15px Pop;color:#fff;margin-bottom:16px}.side .b b{color:var(--teal)}
.side div{padding:8px 10px;border-radius:8px;margin-bottom:4px}.side .on{background:var(--teal);color:#fff}
.main{flex:1;padding:16px 18px;font-family:Inter}
.main h5{font:700 17px Inter}.main .hi{font:400 11px Inter;color:#7A8A99;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid #E6EEF0;border-radius:9px;padding:9px}.kpi small{font-size:10px;color:#7A8A99}.kpi b{display:block;font:700 19px Inter;margin:3px 0}.kpi span{font-size:10px;color:var(--teal);font-weight:600}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:9px}
.panel{background:#fff;border:1px solid #E6EEF0;border-radius:9px;padding:9px;font-size:11px;font-weight:600}
.tbl{margin-top:9px}.tbl div{display:flex;justify-content:space-between;font:400 10.5px Inter;padding:5px 0;border-top:1px solid #EEF3F4}
.st{font-size:9.5px;padding:2px 8px;border-radius:10px;background:#DDF8F1;color:#0E9F85;font-weight:600}
.base{height:22px;background:linear-gradient(180deg,#D6DCE0,#AEB6BC);border-radius:0 0 30px 30px;margin:0 -60px;box-shadow:0 20px 30px rgba(0,0,0,.18)}
/* phone */
.phone{position:absolute;width:250px;height:500px;border-radius:40px;background:#0E1E2C;padding:12px;box-shadow:0 30px 50px rgba(11,35,63,.3)}
.phone .in{background:#fff;border-radius:30px;height:100%;padding:28px 20px;font-family:Inter}
.fld{font:500 12px Inter;color:#3B4B5B;margin-top:14px}.fld div{margin-top:6px;height:34px;border:1px solid #DDE6EA;border-radius:8px;font:400 11px Inter;color:#9AA8B4;padding:9px 10px}
.btn{margin-top:18px;background:var(--teal);color:#fff;text-align:center;border-radius:10px;padding:10px;font:600 14px Inter}
/* mini forms */
.mform{position:absolute;width:300px;padding:24px;font-family:Inter}
.mform h6{font:600 17px Inter;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:12px}.chips span{border:1.5px solid #D2EEE6;background:#fff;border-radius:30px;padding:10px 20px;font:500 19px Inter}
</style></head>
<body><div id="root"></div>
<script>
const S = window.SPEC;
const R = document.getElementById('root');
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
function headline(lines, hl){
  const hs = (hl||'').toLowerCase();
  return lines.map(l => {
    if (hs && l.toLowerCase().includes(hs)) { const i=l.toLowerCase().indexOf(hs);
      return esc(l.slice(0,i))+'<em class="u">'+esc(l.slice(i,i+hs.length))+'</em>'+esc(l.slice(i+hs.length)); }
    return esc(l);}).join('<br>');
}
function laptop(x,y,w,h){
  const k=S.kpis||[["Total Forms","12","↑ 18%"],["Responses","2,842","↑ 24%"],["Workflows","5","↑ 15%"],["Conversion","87.4%","↑ 12%"]];
  const rows=S.rows||[["Contact Form","582","Active"],["Event Registration","341","Active"],["Customer Feedback","276","Active"],["Newsletter Signup","198","Active"]];
  return `<div class="laptop" style="left:${x}px;top:${y}px;width:${w}px"><div class="screen" style="height:${h}px"><div class="app">
  <div class="side"><div class="b">T<b>F</b> TrustForms</div><div class="on">⌂ Dashboard</div><div>▤ Forms</div><div>✉ Responses</div><div>⚙ Workflows</div><div>⧉ Integrations</div><div>▦ Templates</div><div>⚙ Settings</div></div>
  <div class="main"><h5>Good morning 👋</h5><div class="hi">Here's what's happening with your forms today.</div>
  <div class="kpis">${k.map(a=>`<div class="kpi"><small>${a[0]}</small><b>${a[1]}</b><span>${a[2]}</span></div>`).join('')}</div>
  <div class="row2"><div class="panel">Responses Overview<svg width="100%" height="${h*0.22}" viewBox="0 0 300 90" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09BC99" stop-opacity=".25"/><stop offset="1" stop-color="#09BC99" stop-opacity="0"/></linearGradient></defs><path d="M0 75 L40 62 L80 55 L120 60 L160 40 L200 47 L240 30 L300 8 L300 90 L0 90Z" fill="url(#g)"/><polyline points="0,75 40,62 80,55 120,60 160,40 200,47 240,30 300,8" fill="none" stroke="#09BC99" stroke-width="3"/></svg></div>
  <div class="panel">Response Sources<div style="display:flex;align-items:center;gap:10px;margin-top:6px"><svg width="${h*0.2}" height="${h*0.2}" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="#E6EEF0" stroke-width="6"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="#0B233F" stroke-width="6" stroke-dasharray="42 58"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="#09BC99" stroke-width="6" stroke-dasharray="28 72" stroke-dashoffset="-42"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="#53C2A9" stroke-width="6" stroke-dasharray="20 80" stroke-dashoffset="-70"/></svg><div style="font:400 10px Inter;line-height:1.7">● Direct 42%<br>● Social 28%<br>● Website 20%</div></div></div></div>
  <div class="panel tbl">Recent Forms${rows.map(r=>`<div><span>${r[0]}</span><span>${r[1]}</span><span class="st">${r[2]}</span></div>`).join('')}</div>
  </div></div></div><div class="base"></div></div>`;
}
function phone(x,y,title){return `<div class="phone" style="left:${x}px;top:${y}px"><div class="in"><div style="font:700 13px Pop">T<b style="color:#09BC99">F</b> TrustForms</div><div style="font:700 19px Inter;margin-top:18px">${esc(title||'Get in Touch')}</div><div style="font:400 11px Inter;color:#8A99A6">We'd love to hear from you.</div><div class="fld">Full Name<div>Enter your name</div></div><div class="fld">Email Address<div>you@example.com</div></div><div class="fld">Message<div style="height:60px">Your message here…</div></div><div class="btn">Submit</div></div></div>`}
function feats(x,y,w,list){return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;display:flex;flex-direction:column;gap:16px">${list.map(f=>`<div class="card feat"><div class="ico">${f[0]}</div><div><h4>${esc(f[1])}</h4><p>${esc(f[2])}</p></div></div>`).join('')}</div>`}
function strip(list){return `<div class="card strip">${list.map(s=>`<div><i>${s[0]}</i><span><b>${esc(s[1])}</b><small>${esc(s[2])}</small></span></div>`).join('')}</div>`}
function note(x,y,text,arrow){return `<div class="note" style="left:${x}px;top:${y}px">${text.split('|').join('<br>')}${arrow?`<svg width="90" height="70" style="display:block;margin-top:4px" viewBox="0 0 90 70"><path d="M70 5 C 30 10, 15 30, 25 62" fill="none" stroke="#0E9F85" stroke-width="3"/><path d="M14 50 L25 63 L35 50" fill="none" stroke="#0E9F85" stroke-width="3"/></svg>`:''}</div>`}

let html = `<div class="hdr"><div class="logo">T<b>F</b></div><div><div class="word">Trust<b>Forms</b></div><div class="tag">FORMS YOU CAN TRUST</div></div></div>`;
if (S.pill!==false) html += `<div class="pill"><span class="spark">✦</span><span>${esc(S.pill||'Powered by AI Form Generator & Instant Workflows')}</span></div>`;
const L = S.layout;
const checks = `<div class="checks">${(S.checks||['No credit card required','Setup in 2 minutes']).map(c=>`<span>${esc(c)}</span>`).join('')}</div>`;
const cta = `<div class="cta">${esc(S.cta||'Start 14-day Free Trial')} <span style="font-family:Inter">→</span></div>`;
if (L==='split'){ // headline left, laptop right, feature cards left, strip bottom
  html += `<div style="position:absolute;left:60px;top:205px;width:640px"><div class="eyebrow">${esc(S.eyebrow)}</div><h1 style="margin-top:16px;font-size:68px">${headline(S.title,S.highlight)}</h1><p class="sub" style="margin-top:30px;width:560px;font-size:26px">${esc(S.sub)}</p><div style="margin-top:30px">${cta}</div>${checks}</div>`;
  html += laptop(500,720,540,360) + feats(36,760,440,S.features.slice(0,3)) + strip(S.strip);
  if (S.note) html += note(780,230,S.note,true);
} else if (L==='hero'){ // big headline top, laptop + phone, feature row, audience chips
  html += `<div style="position:absolute;left:60px;top:205px;width:960px"><div class="eyebrow">${esc(S.eyebrow)}</div><h1 style="margin-top:16px;font-size:80px">${headline(S.title,S.highlight)}</h1><p class="sub" style="margin-top:30px;width:820px">${esc(S.sub)}</p><div style="margin-top:30px">${cta}</div>${checks}</div>`;
  html += laptop(360,770,620,330) + phone(150,720,S.phone_title) + strip(S.strip);
  if (S.note) html += note(800,300,S.note,false);
} else if (L==='center'){ // centered headline, laptop centre stage, 4 icon features
  html += `<div style="position:absolute;left:60px;right:60px;top:210px;text-align:center"><div class="eyebrow">${esc(S.eyebrow)}</div><h1 style="margin-top:14px;font-size:70px">${headline(S.title,S.highlight)}</h1><p class="sub" style="margin:22px auto 0;width:820px;font-size:26px">${esc(S.sub)}</p></div>`;
  html += `<div style="position:absolute;left:0;right:0;top:600px;display:flex;justify-content:center"><div style="width:760px;height:60px;border-radius:50%;background:radial-gradient(#9BE8D6,transparent 70%);margin-top:430px;position:absolute"></div></div>`;
  html += laptop(210,540,660,380);
  html += `<div style="position:absolute;left:40px;right:40px;top:1010px;display:flex;justify-content:space-around;text-align:center">${S.features.slice(0,4).map(f=>`<div style="width:230px"><div class="ico" style="margin:0 auto 10px">${f[0]}</div><div style="font:600 22px Inter">${esc(f[1])}</div><div style="font:400 18px Inter;color:#5B6B7B">${esc(f[2])}</div></div>`).join('')}</div>`;
  html += `<div style="position:absolute;left:0;right:0;bottom:50px;display:flex;justify-content:center">${cta}</div>`;
} else if (L==='usecases'){ // headline + form mockups for audiences + chips
  html += `<div style="position:absolute;left:60px;top:205px;width:960px"><div class="eyebrow">${esc(S.eyebrow)}</div><h1 style="margin-top:16px">${headline(S.title,S.highlight)}</h1><p class="sub" style="margin-top:28px;width:860px">${esc(S.sub)}</p></div>`;
  const forms=S.forms||[["📝","Survey Form",["How was your experience?"],"Submit"],["👤","Registration",["Full Name","Email Address"],"Sign Up"],["📅","Appointment",["Select Date","Select Time"],"Book Now"]];
  forms.forEach((f,i)=>{html+=`<div class="card mform" style="left:${60+i*330}px;top:${600+(i%2)*30}px;transform:rotate(${[-4,0,4][i]}deg)"><h6>${f[0]} ${esc(f[1])}</h6>${f[2].map(q=>`<div class="fld">${esc(q)}<div>…</div></div>`).join('')}<div class="btn">${esc(f[3])}</div></div>`});
  html += `<div style="position:absolute;left:60px;top:1030px;width:960px"><div class="eyebrow" style="color:var(--teal);margin-bottom:16px">Perfect for</div><div class="chips">${(S.chips||[]).map(c=>`<span>${esc(c)}</span>`).join('')}</div></div>`;
  html += `<div style="position:absolute;left:60px;bottom:50px">${cta}</div>`;
  if (S.note) html += note(820,1180,S.note,false);
}
R.innerHTML = html;
</script></body></html>
